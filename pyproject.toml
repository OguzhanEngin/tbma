[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tbma"
version = "0.1.0"
description = "Tree-Based Moving Average temporal feature learning and forecasting"
readme = "README.md"
authors = [
    {name = "Mustafa Baydoğan"},
    {name = "Berk Görgülü"},
    {name = "Oğuzhan Engin"},
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["time-series", "forecasting", "random-forest", "moving-average", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.23",
    "pandas>=2.2",
    "scipy>=1.9",
    "scikit-learn>=1.4",
]

[project.urls]
Homepage = "https://github.com/OguzhanEngin/tbma"
Repository = "https://github.com/OguzhanEngin/tbma"
Issues = "https://github.com/OguzhanEngin/tbma/issues"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff==0.16.4",
    "twine>=5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint.isort]
known-first-party = ["tbma", "paper_reproduction"]

[tool.coverage.run]
branch = true
source = ["tbma"]

[tool.coverage.report]
fail_under = 100
show_missing = true
