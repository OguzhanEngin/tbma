name: Publish distributions

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  core:
    name: Release core | ${{ matrix.os }} | Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    env:
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install build and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest pytest-cov ruff

      - name: Lint repository Python code
        run: ruff check .

      - name: Build wheel
        run: python -m build --wheel

      - name: Install built wheel
        run: python tools/install_built_wheel.py

      - name: Test installed package with full coverage
        run: >-
          pytest --cov=tbma --cov-branch --cov-report=term-missing
          --cov-fail-under=100

      - name: Run general-use example from installed wheel
        run: python examples/basic_forecasting.py

  paper-reproduction:
    name: Release paper workflow | ${{ matrix.os }} | Python 3.13
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    env:
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            paper_reproduction/requirements.txt

      - name: Install package wheel and paper dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest
          python -m build --wheel
          python tools/install_built_wheel.py
          python -m pip install -r paper_reproduction/requirements.txt

      - name: Test complete TSF paper workflow
        run: pytest -q paper_reproduction/tests/test_paper_tsf_workflow.py

  build:
    name: Build release artifacts
    needs: [core, paper-reproduction]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Verify release tag matches project version
        if: github.event_name == 'push'
        shell: bash
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())['project']
          expected = f"v{project['version']}"
          actual = os.environ["GITHUB_REF_NAME"]
          if actual != expected:
              raise SystemExit(
                  f"Release tag {actual!r} does not match project version "
                  f"{expected!r}"
              )
          PY

      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
          python tools/check_distribution.py

      - name: Store distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/tbma
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tbma
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
